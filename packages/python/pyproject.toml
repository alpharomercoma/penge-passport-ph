[project]
name = "penge-passport-ph"
version = "0.1.1"
description = "PengePassportPH: read-only, rate-limited checker for DFA Philippine passport appointment availability on passport.gov.ph. Library and CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alpha Romer Coma" }]
keywords = ["philippines", "passport", "dfa", "appointment", "availability", "passport.gov.ph", "rate-limited", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://alphaexperiments.com/pengepassportph/"
Documentation = "https://github.com/alpharomercoma/penge-passport-ph/tree/main/packages/python#readme"
Issues = "https://github.com/alpharomercoma/penge-passport-ph/issues"
Changelog = "https://github.com/alpharomercoma/penge-passport-ph/blob/main/packages/penge-passport-ph/CHANGELOG.md"

[project.scripts]
penge-passport-ph = "penge_passport_ph.cli:main"
penge = "penge_passport_ph.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "mypy>=2.3",
    "ruff>=0.16",
    "hypothesis>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["interop: runs the Node.js build alongside Python (needs node and ../dist)"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The help text is kept byte-identical to the Node.js CLI's.
"src/penge_passport_ph/cli.py" = ["E501"]
# Fuzzers are mostly tables of hostile tokens; wrapping them hurts more than it helps.
"tests/test_fuzz.py" = ["E501"]
"tests/test_differential.py" = ["E501"]
