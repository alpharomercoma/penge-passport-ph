<!doctype html>
<!-- Google Play's feature graphic, 1024×500: rendered by capture.cjs. The mark's idea at full
     width: a month of days with no room, and the one that opens. Colours are the site's. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --ink: #17201b; --ink-2: #4f5b55; --full: #eceeed; --line: #dfe5e2; --open: #0a7a43; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; background: #fff; }
  body { position: relative; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: var(--ink); }
  .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .brand svg { width: 52px; height: 55px; }
  .brand .ph { color: var(--open); }
  h1 { margin-top: 30px; font-size: 46px; line-height: 1.08; font-weight: 750; letter-spacing: -0.025em; }
  .sub { margin-top: 18px; font-size: 21px; line-height: 1.35; color: var(--ink-2); }
  .note { margin-top: 22px; font-size: 15px; color: var(--ink-2); }
  .month { position: absolute; right: -36px; top: 50%; transform: translateY(-50%); display: grid; grid-template-columns: repeat(6, 72px); gap: 12px; }
  .d { height: 64px; border-radius: 12px; background: var(--full); }
  .d.o { background: var(--open); box-shadow: 0 10px 28px rgb(10 122 67 / 0.28); }
  .d.b { background: none; border: 2px solid var(--line); }
</style>
</head>
<body>

      <span>PengePassport<span class="ph">PH</span></span>
    </div>
    <h1>Know when a passport appointment opens</h1>
    <p class="sub">Open DFA dates at every office in the Philippines and posts abroad, with email alerts.</p>

</body>
</html>
