<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PengePassportPH ad</title>
<style>
  :root {
    --ink: #17201b; --ink-2: #4f5b55; --bg: #ffffff; --surface: #f5f7f6; --line: #dfe5e2;
    --open: #0a7a43; --open-soft: #e4f3ea; --glow: #3fbf7a; --full: #eceeed; --full-ink: #5f6a64;
    --night: #101713;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
  .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .dark { background: radial-gradient(1200px 800px at 30% 40%, #1d2a23 0%, var(--night) 70%); color: #fff; }
  .light { background: var(--surface); }
  .white { background: #fff; }
  .h1 { font-weight: 800; letter-spacing: -0.045em; line-height: 0.95; }
  .mask { overflow: hidden; display: block; white-space: nowrap; padding-bottom: 0.08em; }
  .mask > span { display: block; will-change: transform; }
  .label { font-weight: 700; font-size: 30px; letter-spacing: -0.01em; }
  .muted { color: rgba(255,255,255,0.55); }

  /* phone */
  .phone { position: absolute; border-radius: 68px; background: #0b0f0d; padding: 14px; box-shadow: 0 50px 120px rgba(0,0,0,0.28), 0 0 0 2px #2b332f inset; }
  .phone .screen { position: relative; overflow: hidden; border-radius: 55px; background: #fff; }
  .phone .screen img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .phone .status { position: absolute; left: 0; top: 0; right: 0; height: 51px; background: #fff; z-index: 4; font: 700 19px -apple-system, sans-serif; color: #111; padding: 17px 0 0 46px; }
  .phone .island { position: absolute; left: 50%; top: 26px; width: 118px; height: 34px; margin-left: -59px; background: #0b0f0d; border-radius: 20px; z-index: 5; }

  /* bits */
  .chip { position: absolute; display: inline-flex; align-items: center; gap: 12px; height: 70px; padding: 0 30px; border-radius: 999px; font-weight: 700; font-size: 32px; white-space: nowrap; }
  .chip.ink { background: var(--ink); color: #fff; }
  .chip.line { background: #fff; color: var(--ink); box-shadow: 0 0 0 2px var(--line) inset; }
  .chip.green { background: var(--open); color: #fff; }
  .chip.glass { background: rgba(255,255,255,0.1); color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.18) inset; }
  .cal { position: absolute; display: grid; grid-template-columns: repeat(7, 96px); gap: 12px; }
  .cell { width: 96px; height: 96px; border-radius: 18px; background: var(--full); color: var(--full-ink); display: grid; place-items: center; font-weight: 700; font-size: 30px; line-height: 1; text-align: center; }
  .cell small { display: block; font-size: 17px; font-weight: 700; margin-top: 4px; }
  .cell.dim { background: transparent; color: rgba(255,255,255,0.35); }
  .cursor { position: absolute; width: 64px; height: 64px; z-index: 50; }
  .ripple { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 6px solid var(--open); z-index: 49; }
  .ring { position: absolute; border-radius: 16px; border: 6px solid var(--open); box-shadow: 0 0 0 10px rgba(10,122,67,0.15); z-index: 20; }
  .stat { position: absolute; }
  .stat b { display: block; font-size: 150px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.9; font-variant-numeric: tabular-nums; }
  .stat span { display: block; font-size: 32px; font-weight: 600; margin-top: 12px; }
  .notif { position: absolute; width: 400px; border-radius: 30px; padding: 20px 22px; background: rgba(246,248,247,0.96); box-shadow: 0 18px 40px rgba(0,0,0,0.25); z-index: 30; display: grid; grid-template-columns: 52px 1fr; gap: 14px; font-size: 18px; line-height: 1.3; }
  .notif .icon { width: 52px; height: 52px; border-radius: 13px; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 1px var(--line) inset; }
  .notif .top { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 16px; font-weight: 600; }
  .notif .title { font-weight: 700; }
  .mail { position: absolute; width: 720px; transform-origin: 0 0; background: #fff; border-radius: 26px; box-shadow: 0 40px 90px rgba(0,0,0,0.22); overflow: hidden; }
  .mail .head { padding: 24px 32px 18px; border-bottom: 1px solid var(--line); font-size: 21px; line-height: 1.5; color: var(--ink-2); }
  .mail .head b { color: var(--ink); font-weight: 700; }
  .mail .head .subj { color: var(--ink); font-size: 26px; font-weight: 800; letter-spacing: -0.01em; margin-top: 6px; }
  .mail img { display: block; width: 100%; }
  .term { position: absolute; width: 1100px; border-radius: 22px; background: #0c110e; box-shadow: 0 30px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08) inset; overflow: hidden; }
  .term .bar { height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: #151c18; }
  .term .bar i { width: 14px; height: 14px; border-radius: 50%; background: #3a443f; display: block; }
  .term pre { padding: 30px 36px 36px; font: 600 30px/1.7 "SF Mono", Menlo, monospace; color: #e8eee9; white-space: pre; min-height: 280px; }
  .term .p { color: var(--glow); }
  .term .o { color: rgba(255,255,255,0.45); }
  .wipe { position: absolute; inset: 0; z-index: 90; pointer-events: none; }
  .flash { position: absolute; inset: 0; background: #fff; z-index: 95; opacity: 0; }
  .black { position: absolute; inset: 0; background: #000; z-index: 96; opacity: 0; }
  .globe { position: absolute; }
  .urlpill { position: absolute; display: inline-flex; align-items: center; height: 96px; padding: 0 44px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 700; font-size: 44px; letter-spacing: -0.01em; white-space: nowrap; }
  .qrcard { position: absolute; width: 360px; padding: 34px; border-radius: 34px; background: #fff; box-shadow: 0 30px 70px rgba(0,0,0,0.12), 0 0 0 2px var(--line) inset; text-align: center; }
  .qrcard img { width: 292px; height: 292px; display: block; }
  .qrcard p { margin-top: 20px; font-size: 26px; font-weight: 700; }
  .fine { position: absolute; font-size: 22px; color: var(--ink-2); font-weight: 500; }
  .typed { position: absolute; font-size: 16px; color: var(--ink); white-space: pre; }
  .caret { display: inline-block; width: 2px; height: 20px; background: var(--ink); vertical-align: -4px; margin-left: 1px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="assets/boxes.js"></script>
<script src="assets/email.js"></script>
<script>
// ---------------------------------------------------------------------------
// Time: 128 BPM, cuts on bar lines (music.py writes the same grid).
const BEAT = 60 / 128, BAR = 4 * BEAT, bar = (n, beat = 0) => (n * 4 + beat) * BEAT;
const LENGTH = 49.08;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  outExpo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  outCubic: (x) => 1 - Math.pow(1 - x, 3),
  inCubic: (x) => x * x * x,
  inOutCubic: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outBack: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outElastic: (x) => (x === 0 || x === 1 ? x : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
};
// Deterministic shake.
const shake = (t, amp) => ({ x: amp * (Math.sin(t * 91.7) * 0.6 + Math.sin(t * 57.3 + 1.3) * 0.4), y: amp * (Math.sin(t * 73.1 + 2.1) * 0.6 + Math.sin(t * 43.9) * 0.4) });
// Pulse on every beat after `from` (1 at the beat, decaying).
const kickPulse = (t, from) => (t < from ? 0 : Math.exp(-((t - from) % BEAT) * 9));

function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  (parent || stage).appendChild(e);
  return e;
}
function put(e, { x = 0, y = 0, s = 1, sx, sy, r = 0, o = 1, blur = 0, rx = 0, ry = 0 } = {}) {
  e.style.transform = `translate(${x}px, ${y}px) perspective(1400px) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${r}deg) scale(${sx ?? s}, ${sy ?? s})`;
  e.style.opacity = o;
  e.style.filter = blur > 0.05 ? `blur(${blur}px)` : 'none';
}
// A line of text revealed from below through a mask.
function line(parent, text, cls, x, y, size, extra = '') {
  const m = el('div', 'abs mask', parent);
  m.style.left = x + 'px'; m.style.top = y + 'px';
  m.style.paddingBottom = Math.round(size * 0.2) + 'px';
  const s = el('span', cls, m, text);
  s.style.fontSize = size + 'px';
  if (extra) s.style.cssText += extra;
  return { m, s };
}
function reveal(ln, t, t0, dur = 0.45, out = null) {
  const p = E.outExpo(prog(t, t0, t0 + dur));
  let y = (1 - p) * 135, o = p > 0 ? 1 : 0;
  if (out) { const q = E.inCubic(prog(t, out, out + 0.3)); y -= q * 135; }
  ln.s.style.transform = `translateY(${y}%)`;
  ln.m.style.opacity = o;
}

const LOGO = (size, openScale = 1) => `<svg width="${size}" height="${size}" viewBox="8 6 78 82"><rect x="12" y="18" width="70" height="66" rx="11" fill="#fff" stroke="#17201b" stroke-width="4"/><path d="M12 34h70" stroke="#17201b" stroke-width="4"/><rect x="29.5" y="10" width="6" height="14" rx="3" fill="#17201b"/><rect x="58.5" y="10" width="6" height="14" rx="3" fill="#17201b"/><g fill="#c5cec9"><rect x="22" y="38" width="9" height="8" rx="2.2"/><rect x="34.5" y="38" width="9" height="8" rx="2.2"/><rect x="47" y="38" width="9" height="8" rx="2.2"/><rect x="59.5" y="38" width="9" height="8" rx="2.2"/><rect x="22" y="49.5" width="9" height="8" rx="2.2"/><rect x="34.5" y="49.5" width="9" height="8" rx="2.2"/><rect x="59.5" y="49.5" width="9" height="8" rx="2.2"/><rect x="22" y="61" width="9" height="8" rx="2.2"/><rect x="34.5" y="61" width="9" height="8" rx="2.2"/><rect x="47" y="61" width="9" height="8" rx="2.2"/><rect x="59.5" y="61" width="9" height="8" rx="2.2"/></g><rect class="open-day" x="47" y="49.5" width="9" height="8" rx="2.2" fill="#0a7a43" style="transform-box: fill-box; transform-origin: center; transform: scale(${openScale})"/></svg>`;
const CURSOR = `<svg viewBox="0 0 24 24" width="64" height="64"><path d="M5 3l14 8.5-6.2 1.3L9.6 19z" fill="#fff" stroke="#17201b" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const CHECK = `<svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const REFRESH = `<svg width="54" height="54" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const STATUS = 47, PHONE_S = 1.08, SCREEN_W = 390 * PHONE_S, SCREEN_H = 844 * PHONE_S;
function phone(parent) {
  const p = el('div', 'phone abs', parent);
  const sc = el('div', 'screen', p);
  sc.style.width = SCREEN_W + 'px'; sc.style.height = SCREEN_H + 'px';
  el('div', 'status', sc, '12:00');
  el('div', 'island', p);
  return { p, sc, imgs: {} };
}
function screenImg(ph, name) {
  const i = el('img', '', ph.sc); i.src = `assets/${name}.png`; ph.imgs[name] = i; return i;
}
// Show one screenshot, scrolled by `scroll` CSS px (in the 390-wide page), with opacity.
function showImg(ph, name, scroll = 0, o = 1, y = 0) {
  const i = ph.imgs[name];
  i.style.transform = `translateY(${(STATUS - scroll) * PHONE_S + y}px)`;
  i.style.opacity = o;
}
// A point on the phone screen (390-wide CSS px) in the phone element's own coordinates.
const onScreen = (x, y) => ({ x: 14 + x * PHONE_S, y: 14 + (y + STATUS) * PHONE_S });

const stage = document.getElementById('stage');
const scenes = [];
function scene(start, end, cls, build, render, enter = 'cut') {
  const root = el('div', `scene ${cls}`);
  const ctx = build(root);
  scenes.push({ start, end, root, ctx, render, enter });
}
// Where the ad taps, rings and types on the captured screens (capture.cjs, email-shot.cjs).
const BOX = window.BOXES, MAIL = window.MAIL;

// ---------------------------------------------------------------------------
// 1. Refresh, refresh, refresh: nothing but "Full".
scene(0, bar(2), 'dark', (r) => {
  const card = el('div', 'abs', r);
  card.style.cssText += 'left:150px;top:150px;width:840px;height:780px;border-radius:40px;background:rgba(255,255,255,0.06);box-shadow:0 0 0 2px rgba(255,255,255,0.1) inset;';
  const title = el('div', 'abs', card, 'October');
  title.style.cssText += 'left:56px;top:48px;font-size:52px;font-weight:800;letter-spacing:-0.03em;color:#fff;';
  const btn = el('div', 'abs', card, REFRESH);
  btn.style.cssText += 'left:716px;top:40px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,0.1);';
  const cal = el('div', 'cal', card); cal.style.left = '56px'; cal.style.top = '170px'; cal.style.gridTemplateColumns = 'repeat(7, 98px)'; cal.style.gap = '12px';
  const cells = [];
  for (let i = 0; i < 35; i++) {
    const d = i - 3;
    const c = el('div', 'cell' + (d < 1 || d > 31 || i % 7 === 0 || i % 7 === 6 ? ' dim' : ''), cal, d >= 1 && d <= 31 ? `${d}${i % 7 === 0 || i % 7 === 6 ? '' : '<small>Full</small>'}` : '');
    c.style.width = c.style.height = '98px';
    cells.push(c);
  }
  const cur = el('div', 'cursor abs', r, CURSOR);
  const rip = el('div', 'ripple abs', r);
  const words = [0, 1, 2].map((k) => line(r, 'Refresh.', 'h1', 1090, 250 + k * 170, 150, 'color:#fff'));
  const big = line(r, 'Full na naman?!', 'h1', 1090, 430, 112, 'color:#fff');
  const sub = line(r, 'Fully booked. Again.', 'label muted', 1096, 570, 40);
  return { card, btn, cells, cur, rip, words, big, sub, cal };
}, (t, c) => {
  const beatNo = Math.floor(t / BEAT);
  const inBeat = (t % BEAT) / BEAT;
  // The refresh button spins on each of the first 4 beats; the page "reloads".
  const spin = beatNo < 4 ? beatNo * 360 + E.outCubic(clamp(inBeat * 1.6)) * 360 : 4 * 360;
  c.btn.style.transform = `rotate(${spin}deg)`;
  const reload = beatNo < 4 ? 0.55 + 0.45 * E.outCubic(clamp(inBeat * 2)) : 1;
  c.cal.style.opacity = reload;
  // Cursor rests on the button and clicks on the beat.
  const bx = 150 + 716 + 42, by = 150 + 40 + 42;
  const arrive = E.outExpo(prog(t, 0, 0.35));
  put(c.cur, { x: lerp(1500, bx - 8, arrive), y: lerp(900, by - 6, arrive), s: beatNo < 4 ? 1 - 0.15 * Math.exp(-inBeat * 10) : 1 });
  const rp = beatNo < 4 ? inBeat : 1;
  put(c.rip, { x: bx, y: by, s: 0.3 + rp * 1.2, o: beatNo < 4 ? 1 - rp : 0 });
  c.words.forEach((w, k) => reveal(w, t, k * BEAT, 0.3, bar(1) - 0.15));
  reveal(c.big, t, bar(1), 0.4);
  reveal(c.sub, t, bar(1, 2), 0.4);
  // "Full na naman" lands with a jolt.
  const sh = shake(t, 10 * Math.exp(-Math.max(0, t - bar(1)) * 6) * (t > bar(1) ? 1 : 0));
  put(c.card, { x: sh.x, y: sh.y, s: 1 - 0.02 * E.outCubic(prog(t, bar(1), bar(2))) });
});

// 2. When slots drop, and how fast they go.
scene(bar(2), bar(4), 'dark', (r) => {
  const lab = line(r, 'New slots drop at', 'label muted', 170, 150, 44);
  const a = line(r, '12:00 NN', 'h1', 160, 220, 190, 'color:#fff');
  const b = line(r, '<span style="color:rgba(255,255,255,0.35)">&amp;</span> 9:00 PM', 'h1', 160, 400, 190, 'color:#fff');
  const row = el('div', 'cal', r); row.style.left = '170px'; row.style.top = '680px'; row.style.gridTemplateColumns = 'repeat(7, 120px)'; row.style.gap = '14px';
  const cells = Array.from({ length: 7 }, (_, i) => { const c = el('div', 'cell', row, `${12 + i}<small>Full</small>`); c.style.width = c.style.height = '120px'; return c; });
  const gone = line(r, 'Ubos agad.', 'h1', 1230, 660, 110, 'color:#fff');
  const gone2 = line(r, 'Gone in minutes.', 'label muted', 1236, 790, 38);
  return { lab, a, b, row, cells, gone, gone2, r };
}, (t, c) => {
  const t0 = bar(2);
  reveal(c.lab, t, t0, 0.35);
  reveal(c.a, t, t0 + 0.05, 0.4);
  reveal(c.b, t, t0 + BEAT * 2, 0.4);
  // At the next bar, days open green one by one... and go grey again just as fast.
  const t1 = bar(3);
  c.cells.forEach((cell, i) => {
    const on = t1 + i * BEAT / 3;
    const green = t >= on && t < on + BEAT * 1.1;
    cell.style.background = green ? 'var(--open)' : 'var(--full)';
    cell.style.color = green ? '#fff' : 'var(--full-ink)';
    cell.querySelector('small').textContent = green ? 'Open' : 'Full';
    const p = E.outBack(prog(t, t0 + BEAT * 3 + i * 0.04, t0 + BEAT * 3 + 0.35 + i * 0.04));
    cell.style.transform = `translateY(${(1 - p) * 60}px) scale(${green ? 1.08 : 1})`;
    cell.style.opacity = clamp(p);
  });
  reveal(c.gone, t, t1 + BEAT * 2, 0.35);
  reveal(c.gone2, t, t1 + BEAT * 2.5, 0.35);
  // The riser: a slow push-in that shakes harder towards the drop.
  const push = E.inCubic(prog(t, t0, bar(4)));
  const sh = shake(t, 14 * push * push);
  put(c.r, { x: sh.x, y: sh.y, s: 1 + 0.08 * push });
});

// 3. The drop: the logo.
scene(bar(4), bar(6), 'white', (r) => {
  const glow = el('div', 'abs', r);
  glow.style.cssText += 'left:560px;top:140px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle, rgba(10,122,67,0.14), rgba(10,122,67,0) 65%);';
  const burst = el('div', 'abs', r);
  burst.style.cssText += 'left:960px;top:430px;width:400px;height:400px;margin:-200px 0 0 -200px;border-radius:50%;border:10px solid var(--open);';
  const logo = el('div', 'abs', r);
  logo.style.cssText += 'left:810px;top:180px;width:300px;height:300px;';
  const word = line(r, 'PengePassport<span style="color:var(--ink-2)">PH</span>', 'h1', 0, 540, 150);
  word.m.style.left = '0'; word.m.style.width = '1920px'; word.s.style.textAlign = 'center';
  const tag = line(r, 'Free email alerts for DFA passport appointments.', 'label', 0, 720, 44, 'font-weight:600;color:var(--ink-2)');
  tag.m.style.width = '1920px'; tag.s.style.textAlign = 'center';
  const pills = ['Free', 'Open source', 'Not a fixer'].map((w) => el('div', 'chip green abs', r, CHECK + w));
  return { glow, burst, logo, word, tag, pills };
}, (t, c) => {
  const t0 = bar(4);
  const p = E.outBack(prog(t, t0, t0 + 0.5));
  const open = E.outElastic(prog(t, t0 + 0.25, t0 + 1.1));
  c.logo.innerHTML = LOGO(300, Math.max(0, open));
  const pulse = kickPulse(t, t0);
  put(c.logo, { s: Math.max(0.001, p) * (1 + 0.03 * pulse), y: (1 - p) * 40 });
  const b = prog(t, t0, t0 + 0.8);
  put(c.burst, { s: 0.2 + E.outCubic(b) * 2.4, o: (1 - b) * 0.9 });
  put(c.glow, { s: 1 + 0.06 * pulse });
  reveal(c.word, t, t0 + 0.2, 0.5);
  reveal(c.tag, t, bar(5), 0.5);
  const xs = [540, 780, 1135];
  c.pills.forEach((pl, i) => {
    const q = E.outBack(prog(t, bar(5, 1 + i * 0.75), bar(5, 1 + i * 0.75) + 0.35));
    put(pl, { x: xs[i], y: 830 + (1 - q) * 40, s: Math.max(0.001, q), o: q > 0 ? 1 : 0 });
  });
});

// 4. Every office at home, on the live site.
scene(bar(6), bar(9), 'light', (r) => {
  const kick = line(r, 'In the Philippines', 'label', 150, 180, 36, 'color:var(--open)');
  const h = line(r, 'Every DFA office.', 'h1', 140, 250, 120);
  const h2 = line(r, 'One list.', 'h1', 140, 370, 120);
  const s1 = el('div', 'stat abs', r, '<b>0</b><span>offices, all in one place</span>');
  const s2 = el('div', 'stat abs', r, '<b>15<small style="font-size:60px;letter-spacing:-0.02em"> min</small></b><span>between checks</span>');
  const chips = ['NCR', 'Luzon', 'Visayas', 'Mindanao'].map((w) => el('div', 'chip line abs', r, w));
  const ph = phone(r); screenImg(ph, 'ph-full');
  return { kick, h, h2, s1, s2, chips, ph };

// Cuts: two panels (green, then ink) sweep right to left, covering the old scene
// exactly on the bar line and uncovering the new one, whose animation starts under them.
const flash = el('div', 'flash'), black = el('div', 'black');
const WIPES = [bar(6), bar(9), bar(12), bar(15), bar(19), bar(21)];
const panels = [el('div', 'wipe'), el('div', 'wipe')];
panels[0].style.background = 'var(--open)'; panels[1].style.background = 'var(--ink)';
const HALF = 0.28;
function sweep(panel, t, W, lag) {
  const a = prog(t, W - HALF + lag, W + lag), b = prog(t, W + lag, W + HALF + lag);
  if (a <= 0 || b >= 1) return false;
  // Leading edge comes in from the right; then the trailing edge follows it out to the left.
  const lead = lerp(112, -12, E.inCubic(a));
  const trail = lerp(112, -12, E.outCubic(b));
  panel.style.clipPath = `polygon(${lead}% 0, ${b > 0 ? trail + 10 : 140}% 0, ${b > 0 ? trail : 130}% 100%, ${lead - 10}% 100%)`;
  return true;
}

window.renderAt = function (t) {
  for (const sc of scenes) {
    const visible = t >= sc.start && t < sc.end;
    sc.root.style.visibility = visible ? 'visible' : 'hidden';
    if (visible) sc.render(t, sc.ctx);
  }
  panels.forEach((pn, k) => {
    const on = WIPES.some((W) => sweep(pn, t, W, k ? 0.05 : -0.05));
    pn.style.visibility = on ? 'visible' : 'hidden';
  });
  // The silence before the drop, then a white flash on it.
  black.style.opacity = t > bar(4) - BEAT * 0.5 && t < bar(4) ? 1 : 0;
  const fl = t >= bar(4) ? Math.exp(-(t - bar(4)) * 7) : 0;
  const fl2 = t >= bar(22) ? Math.exp(-(t - bar(22)) * 8) * 0.8 : 0;
  flash.style.opacity = Math.max(fl, fl2);
};

window.ready = Promise.all([...document.images].map((i) => (i.complete ? Promise.resolve() : new Promise((res) => { i.onload = i.onerror = res; }))))
  .then(() => document.fonts.ready)
  .then(() => true);
const q = new URLSearchParams(location.search);
window.renderAt(Number(q.get('t') ?? 0));
</script>
