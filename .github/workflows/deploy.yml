# Ships main to the server after CI passes on it. Needs three repository
# secrets (see deploy/README.md): DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS,
# kept in the `production` environment (restrict it to main, with a reviewer if
# more than one person can push).
#
# Two jobs: `build` runs npm and the build with no secrets at all; `deploy`
# only downloads the built files and ships them. Actions are pinned to commits.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to check that CI passed on the commit

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    # Only main: a manual run from another branch must not reach production.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      go: ${{ steps.guard.outputs.go }}
    steps:
      # A run for an older commit (its CI finished late) must not roll production
      # back, and a manual run must not ship a commit CI has not passed.
      - name: Only the tip of main, and only once CI has passed on it
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)
          if [ "$tip" != "$SHA" ]; then
            echo "main is now at $tip, so $SHA is not deployed; the newer commit's run deploys it."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" -q .total_count)
          if [ "$passed" -lt 1 ]; then
            echo "::error::CI has not passed on $SHA; not deploying it."
            exit 1
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.go == 'true'
        with:
          # The commit CI tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.go == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.guard.outputs.go == 'true'
        run: npm ci
      - if: steps.guard.outputs.go == 'true'
        run: deploy/release.sh build release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.guard.outputs.go == 'true'
        with:
          name: release
          path: release/
          # The website has a hidden directory: .well-known/assetlinks.json.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    if: needs.build.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: deploy
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: release
      - name: SSH identity and the server's pinned host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONF
          Host production
            HostName $DEPLOY_HOST
            User penge-deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          CONF
      - name: Ship and activate
        run: deploy/release.sh ship release production
      - name: Public readiness check
        run: |
          . deploy/site.conf
          curl -fsS --retry 5 --retry-delay 3 "https://$SITE_ADDRESS$BASE_PATH/api/ready"
